<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="StoryTube">
  <title>StoryTube</title>
  <!-- A red rounded plate with a white play triangle - the YouTube gesture
       without the YouTube proportions. Paths only, no <text>, so the mark
       never depends on an installed font. -->
  <rect width="64" height="64" rx="14" fill="#ff0000" />
  <path d="M25 18l22 14-22 14z" fill="#ffffff" />
</svg>
