<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="StoryTube">
  <title>StoryTube</title>
  <!-- A calendar page in the Bulgarian tricolour with two binder rings.
       Shapes only, no <text>, so the mark never depends on an installed font,
       and a dark outline keeps it readable on light and dark tab bars. -->
  <defs>
    <clipPath id="page"><rect x="4" y="12" width="56" height="48" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#page)">
    <rect x="4" y="12" width="56" height="16" fill="#ffffff"/>
    <rect x="4" y="28" width="56" height="16" fill="#00966e"/>
    <rect x="4" y="44" width="56" height="16" fill="#d62612"/>
  </g>
  <rect x="4" y="12" width="56" height="48" rx="10" fill="none" stroke="#0f0f0f" stroke-width="4"/>
  <rect x="16" y="3" width="8" height="16" rx="4" fill="#0f0f0f"/>
  <rect x="40" y="3" width="8" height="16" rx="4" fill="#0f0f0f"/>
</svg>
