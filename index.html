<!doctype html>
<html lang="bg" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="description" content="Български празници и паметни дати, разказани за деца — с история, картинки и календар." />
    <title>StoryTube</title>
    <script>
      // Runs before first paint. Dark is the committed default on <html>, so we
      // only ever remove it — that way there is no light-then-dark flash.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {
        /* storage blocked — keep the default */
      }
    </script>
    <!-- The header follows the theme (white in light, near-black in dark), so
         the static shell needs both colour sets, hence a tiny stylesheet rather
         than a single inline style. -->
    <style>
      #st-shell {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 56px;
        padding: 0 16px;
        box-sizing: border-box;
        background: #ffffff;
        color: #0f0f0f;
        font-family: Roboto, Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      @media (max-width: 639px) {
        .st-shell-name { display: none; }
      }
      .dark #st-shell {
        background: #0f0f0f;
        color: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <!-- Static app shell: paints the branded bar on first byte, before the JS
         bundle exists. React replaces it on mount. Metrics match Logo/ChromeBar
         exactly so the swap does not shift layout. -->
    <div id="root">
      <div id="st-shell">
        <svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true">
          <defs><clipPath id="st-shell-clip"><rect x="1.5" y="4" width="27" height="18.5" rx="4" /></clipPath></defs>
          <g clip-path="url(#st-shell-clip)">
            <rect x="1.5" y="4" width="27" height="6.5" fill="#ffffff" /><rect x="1.5" y="10.5" width="27" height="6" fill="#00966e" /><rect x="1.5" y="16.5" width="27" height="6" fill="#d62612" />
          </g>
          <rect x="1.5" y="4" width="27" height="18.5" rx="4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <rect x="8" y="1" width="3" height="6" rx="1.5" fill="currentColor" /><rect x="19" y="1" width="3" height="6" rx="1.5" fill="currentColor" />
        </svg>
        <span class="st-shell-name">StoryTube</span>
      </div>
      <noscript>
        <p style="padding:16px;font-family:Roboto,Arial,Helvetica,sans-serif">
          За да разгледате празниците, включете JavaScript.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
